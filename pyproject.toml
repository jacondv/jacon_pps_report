[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pps"
dynamic = ["version"]
description = "Jacon PPS Report"
requires-python = ">=3.9"

[tool.setuptools.dynamic]
version = {attr = "pps.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
