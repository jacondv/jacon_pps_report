<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Guide - Jacon PPS Report</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-alt: #f5f7fa;
    --text: #1c2430;
    --text-soft: #4a5568;
    --accent: #2563eb;
    --accent-soft: #eaf1ff;
    --border: #e2e8f0;
    --code-bg: #eef2f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--text);
    background: var(--bg);
    line-height: 1.55;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 8px;
  }
  nav.toc {
    padding: 0 0 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
    page-break-after: always;
  }
  nav.toc h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-soft);
    margin: 0 0 12px;
  }
  nav.toc a {
    display: block;
    padding: 4px 0;
    color: var(--text);
    text-decoration: none;
    font-size: 14px;
  }
  header.hero {
    padding: 12px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }
  header.hero .eyebrow {
    color: var(--accent);
    font-weight: 600;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  header.hero h1 {
    font-size: 30px;
    margin: 0 0 12px;
  }
  header.hero p.lead {
    font-size: 14.5px;
    color: var(--text-soft);
    margin: 0;
  }
  section {
    margin-bottom: 34px;
    page-break-inside: avoid;
  }
  section h2 {
    font-size: 19px;
    margin: 0 0 10px;
  }
  section h2 .num {
    display: inline-block;
    width: 26px;
    height: 26px;
    line-height: 26px;
    text-align: center;
    border-radius: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    font-size: 13px;
    font-weight: 700;
    margin-right: 6px;
  }
  section h3 {
    font-size: 15px;
    margin: 20px 0 8px;
  }
  section .subtitle {
    color: var(--text-soft);
    margin: 0 0 14px;
    font-size: 13.5px;
  }
  section p { margin: 0 0 12px; }
  section ul, section ol { margin: 0 0 12px; padding-left: 20px; }
  section li { margin-bottom: 4px; }
  figure {
    margin: 14px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg-alt);
    page-break-inside: avoid;
  }
  figure img {
    display: block;
    width: 100%;
    height: auto;
  }
  figcaption {
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text-soft);
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  code {
    background: var(--code-bg);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: Consolas, monospace;
    font-size: 12px;
  }
  kbd {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 5px;
    background: var(--code-bg);
    border: 1px solid var(--border);
    font-family: Consolas, monospace;
    font-size: 11.5px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 10px 0 16px;
    font-size: 12.5px;
  }
  table th, table td {
    text-align: left;
    padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  table th {
    color: var(--text-soft);
    font-weight: 600;
    font-size: 11.5px;
    text-transform: uppercase;
  }
  .callout {
    border-left: 4px solid var(--accent);
    background: var(--accent-soft);
    padding: 10px 14px;
    border-radius: 0 6px 6px 0;
    font-size: 13px;
    margin: 14px 0;
    page-break-inside: avoid;
  }
  .callout strong { color: var(--accent); }
  .callout.warn {
    border-left-color: #d97706;
    background: #fff7e6;
  }
  .callout.warn strong { color: #b45309; }
  .grid-2 {
    display: block;
  }
  footer {
    color: var(--text-soft);
    font-size: 12px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }
  .warning-box {
    border: 2px solid #1c2430;
    border-radius: 4px;
    overflow: hidden;
    margin: 0 0 16px;
    page-break-inside: avoid;
  }
  .warning-box .warning-head {
    background: #f7941d;
    color: #1c2430;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    padding: 8px 14px;
  }
  .warning-box .warning-head .tri { font-size: 20px; margin-right: 8px; }
  .warning-box .warning-body {
    padding: 16px 20px;
    text-align: center;
    background: #fff;
  }
  .warning-box .warning-body p { margin: 0 0 12px; font-weight: 600; }
  .warning-box .warning-body p:last-child { margin-bottom: 0; }
  .contact-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    page-break-inside: avoid;
  }
  .contact-card .band {
    background: #1a7f7c;
    color: #fff;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 6px 14px;
    font-size: 13px;
  }
  .contact-card table { margin: 0; font-size: 12px; }
  .contact-card table td { padding: 8px 14px; }
  .contact-card table td.label { color: var(--text-soft); width: 46%; }
  .contact-card .foot {
    display: flex;
    justify-content: space-between;
    padding: 10px 14px;
    font-size: 10.5px;
    color: var(--text-soft);
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>
<main>
  <header class="hero">
    <div class="eyebrow">User Guide</div>
    <h1>Jacon PPS Report</h1>
    <p class="lead">
      A complete walkthrough of the application: loading a post-processed
      scan, navigating and measuring in 3D, extracting segments, annotating
      findings, running the thickness analysis, and exporting a
      professional PDF report.
    </p>
  </header>

  <nav class="toc">
    <h2>Contents</h2>
{{TOC}}
  </nav>

{{SECTIONS}}
  <footer>
    Jacon PPS Report
  </footer>
</main>
</body>
</html>
